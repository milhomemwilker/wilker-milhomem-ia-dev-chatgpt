name: CI
on:
  push:
    branches: [main, staging, 'feature/**', 'bugfix/**']
  pull_request:
    branches: [main, staging]
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node scripts/build-pages.cjs .
      - run: npm run test:e2e
        env:
          TEST_SITE_ROOT: dist
          TEST_BASE_PATH: /staging/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homologacao-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
